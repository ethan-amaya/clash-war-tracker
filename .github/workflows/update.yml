name: Update War Data

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch war data
        env:
          CR_API_KEY: ${{ secrets.CR_API_KEY }}
          CLAN_TAG: ${{ secrets.CLAN_TAG }}
        run: python fetch_wars.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/wars.json
          git diff --cached --quiet || git commit -m "chore: update war data"
          git push
