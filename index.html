<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clan War Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #f0f6fc;
    }

    header p {
      font-size: 0.85rem;
      color: #8b949e;
      margin-top: 0.4rem;
    }

    .legend {
      display: flex;
      gap: 1.2rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.82rem;
      color: #8b949e;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot-green  { background: #2ea043; }
    .dot-orange { background: #d29922; }
    .dot-red    { background: #da3633; }
    .dot-blue   { background: #58a6ff; }

    .note {
      text-align: center;
      font-size: 0.78rem;
      color: #6e7681;
      margin-bottom: 2rem;
    }

    .table-wrap {
      overflow-x: auto;
      max-width: 900px;
      margin: 0 auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    thead th {
      background: #161b22;
      color: #8b949e;
      text-align: left;
      padding: 0.7rem 1rem;
      font-weight: 600;
      border-bottom: 1px solid #30363d;
      white-space: nowrap;
    }

    tbody tr {
      border-bottom: 1px solid #21262d;
      transition: background 0.1s;
    }

    tbody tr:hover { background: #161b22; }

    td {
      padding: 0.6rem 1rem;
      vertical-align: middle;
    }

    .player-name { font-weight: 500; }

    .trophy-cell {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .trophy-zero { color: #6e7681; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.03em;
    }

    .badge-green  { background: #1a3a22; color: #3fb950; }
    .badge-orange { background: #3a2c0a; color: #e3b341; }
    .badge-red    { background: #3a1212; color: #f85149; }
    .badge-blue   { background: #102a43; color: #58a6ff; }

    .status-col { text-align: center; }

    #error {
      text-align: center;
      color: #f85149;
      margin-top: 4rem;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Clan War Tracker</h1>
    <p id="updated">Loading...</p>
  </header>

  <div class="legend">
    <div class="legend-item"><div class="dot dot-green"></div> 800+ trophies in at least one war</div>
    <div class="legend-item"><div class="dot dot-orange"></div> Participated but under 800 in both</div>
    <div class="legend-item"><div class="dot dot-red"></div> Did not participate in either war</div>
    <div class="legend-item"><div class="dot dot-blue"></div> Joined within the last 2 weeks</div>
  </div>

  <p class="note">Only current clan members are shown.</p>

  <div class="table-wrap">
    <table id="war-table" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>Player</th>
          <th id="war1-header">War 1 Trophies</th>
          <th id="war2-header">War 2 Trophies</th>
          <th class="status-col">Status</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div id="error" style="display:none"></div>

  <script>
    function classify(m) {
      if (m.isNew) return "new";
      if (m.trophies1 === 0 && m.trophies2 === 0) return "red";
      if (m.trophies1 < 800 && m.trophies2 < 800) return "orange";
      return "green";
    }

    function badgeHtml(status) {
      const map = {
        green:  { cls: "badge-green",  label: "Active" },
        orange: { cls: "badge-orange", label: "Low Trophies" },
        red:    { cls: "badge-red",    label: "Inactive" },
        new:    { cls: "badge-blue",   label: "New Member" },
      };
      const { cls, label } = map[status];
      return `<span class="badge ${cls}">${label}</span>`;
    }

    function fmtTrophies(v) {
      if (v === null || v === undefined) return `<span class="trophy-zero">—</span>`;
      if (v === 0) return `<span class="trophy-zero">0</span>`;
      return v.toLocaleString();
    }

    function statusOrder(s) {
      return s === "red" ? 0 : s === "orange" ? 1 : s === "green" ? 2 : 3;
    }

    async function load() {
      try {
        const resp = await fetch("./data/wars.json");
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();

        const updated = new Date(data.updated);
        const formatted = updated.toLocaleString(undefined, { timeZoneName: "short" });
        document.getElementById("updated").textContent =
          `Last updated: ${formatted}`;

        document.getElementById("war1-header").textContent =
          `${data.season1 || "War 1"} Trophies`;
        document.getElementById("war2-header").textContent =
          `${data.season2 || "War 2"} Trophies`;

        const rows = data.members || [];
        rows.sort((a, b) => {
          const sa = classify(a);
          const sb = classify(b);
          const ord = statusOrder(sa) - statusOrder(sb);
          if (ord !== 0) return ord;
          return ((b.trophies1 || 0) + (b.trophies2 || 0)) - ((a.trophies1 || 0) + (a.trophies2 || 0));
        });

        const tbody = document.getElementById("tbody");
        rows.forEach((r, i) => {
          const status = classify(r);
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td style="color:#6e7681;font-size:0.8rem">${i + 1}</td>
            <td class="player-name">${r.name}</td>
            <td class="trophy-cell">${fmtTrophies(r.trophies1)}</td>
            <td class="trophy-cell">${fmtTrophies(r.trophies2)}</td>
            <td class="status-col">${badgeHtml(status)}</td>
          `;
          tbody.appendChild(tr);
        });

        document.getElementById("war-table").style.display = "";
      } catch (e) {
        const el = document.getElementById("error");
        el.textContent = `Failed to load war data: ${e.message}`;
        el.style.display = "";
        document.getElementById("updated").textContent = "";
      }
    }

    load();
  </script>
</body>
</html>
